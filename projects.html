<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — TheprimeV</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <script>
        (function(){
            try{
                const stored = localStorage.getItem('theme');
                if(stored) document.documentElement.dataset.theme = stored;
                else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
                else document.documentElement.dataset.theme = 'light';
            }catch(e){}
        })();
    </script>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="page active" style="max-width: 920px;">
        <div class="section-title">All Projects</div>

        <!-- Filter Tags -->
        <div class="filter-tags">
            <button class="filter-tag active" data-filter="all">All</button>
            <button class="filter-tag" data-filter="automation">Automation</button>
            <button class="filter-tag" data-filter="system">System</button>
            <button class="filter-tag" data-filter="web">Web</button>
        </div>

        <!-- Projects Grid -->
        <div class="projects-grid" id="all-projects"></div>

    </div>

    <!-- NAVBAR -->
    <nav id="navbar">
        <button class="nav-btn" id="nav-home" onclick="window.location.href='index.html'">
            <i class="bi bi-house-fill"></i>Home
        </button>
        <button class="nav-btn active" id="nav-projects" onclick="window.location.href='projects.html'">
            <i class="bi bi-grid-3x3-gap-fill"></i>Projects
        </button>
        <button class="nav-btn" id="nav-blog" onclick="window.location.href='blog.html'">
            <i class="bi bi-journal-text"></i>Blog
        </button>
        <button class="nav-btn" id="nav-store" onclick="window.location.href='index.html#store'">
            <i class="bi bi-shop"></i>Store
        </button>
        <button class="nav-btn" id="nav-contact" onclick="window.location.href='index.html#contact'">
            <i class="bi bi-send-fill"></i>Contact
        </button>
        <div class="nav-divider"></div>
        <button id="darkToggle" onclick="toggleDark()" title="Toggle theme">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </nav>

    <script src="js/main.js"></script>
</body>
</html>
