<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — ThecrashO</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="assets/images/logo-icon.png" />

    <script>
        (function(){
            try{
                const stored = localStorage.getItem('theme');
                if(stored) document.documentElement.dataset.theme = stored;
                else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
                else document.documentElement.dataset.theme = 'light';
            }catch(e){}
        })();
    </script>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

    <div class="page active projects-page">
        <div class="section-title">All Projects</div>
        <p class="projects-intro">A focused selection of systems, web products, and AI automations built around practical problems.</p>

        <!-- Filter Tags -->
        <div class="filter-tags">
            <button class="filter-tag active" data-filter="all">All <span class="filter-count">0</span></button>
            <button class="filter-tag" data-filter="ai">AI <span class="filter-count">0</span></button>
            <button class="filter-tag" data-filter="automation">Automation <span class="filter-count">0</span></button>
            <button class="filter-tag" data-filter="system">System <span class="filter-count">0</span></button>
            <button class="filter-tag" data-filter="web">Web <span class="filter-count">0</span></button>
        </div>

        <!-- Minimal Case Study List -->
        <div class="projects-case-list" id="all-projects"></div>

    </div>

    <!-- PROJECT DETAIL MODAL TEMPORARILY HIDDEN
    <div class="project-modal" id="project-modal" aria-hidden="true">
        <div class="project-modal-backdrop" data-close-project></div>
        <div class="project-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
            <button class="project-modal-close" type="button" data-close-project aria-label="Close project details">
                <i class="bi bi-x-lg"></i>
            </button>
            <div id="project-modal-content"></div>
        </div>
    </div>
    END PROJECT DETAIL MODAL -->

    <!-- NAVBAR -->
    <nav id="navbar">
        <button class="nav-btn" id="nav-home" onclick="window.location.href='index.html'">
            <i class="bi bi-house-fill"></i>Home
        </button>
        <button class="nav-btn active" id="nav-projects" onclick="window.location.href='projects.html'">
            <i class="bi bi-grid-3x3-gap-fill"></i>Projects
        </button>
        <button class="nav-btn" id="nav-blog" onclick="window.location.href='paper.html'">
            <i class="bi bi-journal-text"></i>Paper
        </button>
        <button class="nav-btn" id="nav-store" onclick="window.location.href='index.html#store'">
            <i class="bi bi-shop"></i>Store
        </button>
        <button class="nav-btn" id="nav-contact" onclick="window.location.href='index.html#contact'">
            <i class="bi bi-send-fill"></i>Contact
        </button>
        <div class="nav-divider"></div>
        <button id="darkToggle" onclick="toggleDark()" title="Toggle theme">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </nav>

    <script src="js/main.js?v=7"></script>
</body>
</html>
