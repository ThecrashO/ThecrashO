<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper — ThecrashO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/logo-icon.png" />
    <link rel="apple-touch-icon" href="assets/images/logo-icon.png" />

        <script>
            (function(){
                try{
                    const stored = localStorage.getItem('theme');
                    if(stored) document.documentElement.dataset.theme = stored;
                    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
                    else document.documentElement.dataset.theme = 'light';
                }catch(e){}
            })();
        </script>
</head>
<body class="paper-page">
    <div class="page active" style="max-width: 920px;">
        <div class="section-title">Paper</div>
        <p class="paper-intro">
            AI၊ Web Development၊ Automation၊ နည်းပညာအတွေးအမြင်များနှင့် ကိုယ်ပိုင်အတွေးအမြင်များကို အထောက်အထား၊ အတွေ့အကြုံများဖြင့် ရှင်းလင်းစွာ မျှဝေထားသော စာစုများ။
        </p>

        <div id="blog-listing" class="blog-grid"></div>
        <div id="blog-article" style="display:none; margin-top: 8px;"></div>

        <div style="margin-top: 40px; text-align: center;">
            <button class="btn-outline" onclick="window.location.href='paper.html'" id="blog-back-btn" style="display:none;">
                <i class="bi bi-arrow-left"></i> Back
            </button>
        </div>
    </div>

    <nav id="navbar">
        <button class="nav-btn" id="nav-home" onclick="window.location.href='index.html'">
            <i class="bi bi-house-fill"></i>Home
        </button>
        <button class="nav-btn" id="nav-projects" onclick="window.location.href='projects.html'">
            <i class="bi bi-grid-3x3-gap-fill"></i>Projects
        </button>
        <button class="nav-btn active" id="nav-blog" onclick="window.location.href='paper.html'">
            <i class="bi bi-journal-text"></i>Paper
        </button>
        <button class="nav-btn" id="nav-store" onclick="window.location.href='index.html#store'">
            <i class="bi bi-shop"></i>Store
        </button>
        <button class="nav-btn" id="nav-contact" onclick="window.location.href='index.html#contact'">
            <i class="bi bi-send-fill"></i>Contact
        </button>
        <div class="nav-divider"></div>
        <button id="darkToggle" onclick="toggleDark()" title="Toggle theme">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/paper.js"></script>
</body>
</html>
