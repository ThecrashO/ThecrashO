<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper — ThecrashO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/style.css?v=17" />

    <!-- Browser and Home Screen icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="ThecrashO" />
    <meta name="apple-mobile-web-app-title" content="ThecrashO" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

        <script>
            (function(){
                try{
                    const stored = localStorage.getItem('theme');
                if(stored) document.documentElement.dataset.theme = stored;
                else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
                else document.documentElement.dataset.theme = 'light';
                if(new URLSearchParams(window.location.search).has('post')) document.documentElement.classList.add('paper-article-route');
            }catch(e){}
            })();
        </script>
</head>
<body class="paper-page">
    <div class="page active paper-layout" style="max-width: 920px;">
        <header class="paper-page-header">
            <div class="section-title">Paper</div>
            <p class="paper-intro">
            AI၊ Web Development၊ Automation၊ နည်းပညာအတွေးအမြင်များနှင့် ကိုယ်ပိုင်အတွေးအမြင်များကို အထောက်အထား၊ အတွေ့အကြုံများဖြင့် ရှင်းလင်းစွာ မျှဝေထားသော စာစုများ။
            </p>
        </header>

        <div id="blog-listing" class="blog-grid"></div>
        <div id="blog-article" style="display:none; margin-top: 8px;"></div>

        <div style="margin-top: 40px; text-align: center;">
            <button class="btn-outline" onclick="window.location.href='/paper'" id="blog-back-btn" style="display:none;">
                <i class="bi bi-arrow-left"></i> Back
            </button>
        </div>
    </div>

    <nav id="navbar">
        <button class="nav-btn" id="nav-home" onclick="window.location.href='/'">
            <i class="bi bi-house-fill"></i>Home
        </button>
        <button class="nav-btn" id="nav-projects" onclick="window.location.href='/projects'">
            <i class="bi bi-grid-3x3-gap-fill"></i>Projects
        </button>
        <button class="nav-btn active" id="nav-blog" onclick="window.location.href='/paper'">
            <i class="bi bi-journal-text"></i>Paper
        </button>
        <button class="nav-btn" id="nav-store" onclick="window.location.href='/store'">
            <i class="bi bi-shop"></i>Store
        </button>
        <button class="nav-btn" id="nav-contact" onclick="window.location.href='/contact'">
            <i class="bi bi-send-fill"></i>Contact
        </button>
        <div class="nav-divider"></div>
        <button id="darkToggle" onclick="toggleDark()" title="Toggle theme">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/main.js?v=15"></script>
    <script src="/js/paper.js?v=4"></script>
</body>
</html>
